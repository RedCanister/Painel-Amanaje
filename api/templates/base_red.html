{% extends "base_template.html" %}

{% block title %}Data Operations - Painel Amanajé{% endblock %}

{% block extra_css %}
<style>
    .form-section { margin-bottom: 2rem; padding: 1rem; border: 1px solid #ddd; border-radius: 4px; }
    .form-section h3 { color: #e63946; margin-top: 0; }
    .upload-area { border: 2px dashed #ccc; padding: 2rem; text-align: center; margin: 1rem 0; }
    .upload-area.dragover { border-color: #e63946; background: #fff5f5; }
    .feature-list { list-style: none; padding: 0; }
    .feature-item { padding: 0.5rem; border-bottom: 1px solid #eee; }
    .data-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; }
</style>
{% endblock %}

{% block content %}
<div class="data-operations">
    <!-- Upload Section -->
    <section class="form-section" id="uploadSection">
        <h3>Data Upload</h3>
        
         <!-- TODO - The form must have the option of choice between the upload of a model and of a dataset -->
         <!-- TODO - The toggle between the model and dataset form is based on OperationID. first is dataset, second is model -->
        <form id="uploadForm" enctype="multipart/form-data">

            <div class="form-group">
                <label>Operation ID:</label>
                <select id="operationId" name="operationId">
                    <!-- TODO - Use <ToggleFormOptions> here, with Datasets and Models-->
                    <option value="datasets"> Datasets </option>
                    <option value="models"> Models </option>
                </select>
            </div>
            
            <!-- Dataset Form fields -->
            <div id="datasetFields">
                <div class="form-group">
                    <label>Dataset Name:</label>
                    <input type="text" id="objectName" name="objectName" required>
                </div>
                <div class="form-group">
                    <label>Description:</label>
                    <textarea id="description" name="description"></textarea>
                </div>
                <div class="form-group">
                    <label>Dataset type:</label>
                    <select id="datasetType" name="datasetType">
                        <option value="numerical"> Numerical </option>
                        <option value="categorical"> Categorical </option>
                        <option value="time-series"> Time-Series </option>
                        <option value="image"> Image </option>
                        <option value="videoAudio"> Video-Audio </option>
                        <option value="text"> Text </option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Connection String</label>
                    <textarea id="connectionString" name="connectionString"></textarea>
                </div>
            </div>

            <!-- Model Form Fields -->
            <div id="modelFields", style="display: none;">
                <div class="form-group">
                    <label>Model Name:</label>
                    <input type="text" id="objectName" name="objectName" required>
                </div>
                <div class="form-group">
                    <label>Description:</label>
                    <textarea id="description" name="description"></textarea>
                </div>
                <div class="form-group">
                    <label>Model type:</label>
                    <select id="modelType" name="modelType">
                        <option value="numerical"> Numerical </option>
                        <option value="categorical"> Categorical </option>
                        <option value="time-series"> Time-Series </option>
                        <option value="image"> Image </option>
                        <option value="videoAudio"> Video-Audio </option>
                        <option value="text"> Text </option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Parameters:</label>
                    <textarea id="parameters" name="parameters"></textarea>
                </div>
                <div class="form-group">
                    <label>Metrics:</label>
                    <textarea id="metrics" name="metrics"></textarea>
                </div>
                <div class="form-group">
                    <label>Reference data:</label>
                    <textarea id="referenceData" name="referenceData"></textarea>
                </div>
            </div>

            <!-- Drag and drop file upload zone -->
            <div class="upload-area" id="dropZone">
                <p>Drag files here or click to select</p>
                <input type="file" id="fileInput" name="file" hidden>
            </div>
            <button type="submit" class="btn btn-primary">Upload</button>
            <!-- TODO - Having uploaded the dataset, the user must have feedback on the operation -->
        </form>
        <div id="uploadResult"></div>
    </section>

    <!-- Features Section -->
    <section class="form-section" id="featuresSection">
        <h3>Upload History</h3>
        <div class="feature-controls">
            <button onclick="refreshFeatures()" class="btn">Refresh Features</button>

            <!-- TODO - Extracting features will break down datasets into individual columns and stored for later use -->
            <button onclick="extractFeatures()" class="btn">Extract Features</button>

            <!-- TODO - Create a createFeatures() method to form a dataset based on selected features -->
            <!-- <button onclick="createFeatures()" class="btn">Create Features</button> -->
        </div>
        <div class="feature-list" id="featureList">
            <!-- Features will be populated here -->
        </div>
    </section>

    <!-- Analysis Section -->
    <section class="form-section" id="analysisSection">
        <h3>Data Analysis</h3>
        <div class="analysis-controls">
            <select id="datasetSelect">
                <option value="">Select Dataset</option>
            </select>

            <!-- TODO - The analyzeData() method will return visualizations from a plotly dash route with options
             on which columns to select, and which plots to use -->
            <button onclick="analyzeData()" class="btn">Analyze</button>
        </div>
        <div id="analysisResults" class="data-grid">
            <!-- Analysis results will be shown here -->
        </div>
    </section>
</div>
{% endblock %}

{% block extra_js %}
<script>

// Upload handling
const uploadForm = document.getElementById('uploadForm');
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');

dropZone.addEventListener('click', () => fileInput.click());

dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropZone.classList.add('dragover');
});

dropZone.addEventListener('dragleave', () => {
    dropZone.classList.remove('dragover');
});

dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    fileInput.files = e.dataTransfer.files;
});


uploadForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const formData = new FormData();
    // Append file and additional metadata fields to the multipart form
    const file = fileInput.files[0];
    if (!file) {
        document.getElementById('uploadResult').innerHTML = `<div class="alert alert-error">No file selected</div>`;
        return;
    }

    const operationId = document.getElementById('operationId').value;

    formData.append('file', file);
    formData.append('operationId', document.getElementById('operationId').value);
    formData.append('objectName', document.getElementById('objectName').value);
    formData.append('description', document.getElementById('description').value);

    if (operationId == "dataset"){
        formData.append('datasetType', document.getElementById('datasetType').value);
        formData.append('connectionString', document.getElementById('connectionString').value);
    } else if (operationId == "model"){
        formData.append('modelType', document.getElementById('modelType').value);
        formData.append('parameters', document.getElementById('parameters').value);
        formData.append('metrics', document.getElementById('metrics').value);
        formData.append('referenceData', document.getElementById('referenceData').value);   
    }
    

    try {
        const operationId = document.getElementById('operationId').value;
        const response = await fetch(`/upload/${operationId}`, {
            method: 'POST',
            body: formData
        });
        const result = await response.json();
        // Provide clean feedback: status and returned id/path
        const ok = response.ok;
        document.getElementById('uploadResult').innerHTML = 
            `<div class="alert ${ok ? 'alert-success' : 'alert-error'}">
                <strong>Status:</strong> ${result.status || (ok ? 'ok' : 'error')}<br/>
                <strong>ID:</strong> ${result.id || 'n/a'}<br/>
                <strong>Path:</strong> ${result.path || ''}
            </div>`;
    } catch (error) {
        document.getElementById('uploadResult').innerHTML = 
            `<div class="alert alert-error">Upload failed: ${error.message}</div>`;
    }
});

// TODO - I would like this function to be standardized to be used in all templates.
// To fit and scale any back-end database object, in the pydantic or sqlaclhemy-postgres format.
// TODO - I'd like to be simply call it <ToggleFormOptions>
uploadForm.addEventListener('DOMContentLoaded', function () {
    const operationIdSelect = uploadForm.getElementById('operationId');
    const datasetFields = uploadForm.getElementById('datasetFields');
    const modelFields = uploadForm.getElementById('modelFields');

    function toggleFormFields() {
        if (operationIdSelect.value == 'datasets') {
            datasetFields.style.display = 'none';
            modelFields.style.display = 'block';
        } else if (operationIdSelect.value == 'models') {
            datasetFields.style.display = 'block';
            modelFields.style.display = 'none';
        }
    }

    toggleFormFields();

    operationIdSelect.addEventListener('change', toggleFormFields)
});

// TODO - I need a function to use as a template when I would like to
// populate a selection box in a scalable and modular manner.
// Made to fit back-end database object, in the pydantic or sqlaclhemy-postgres format.
// TODO - I would like to call it <PopulateListObjects>. It needs to have back and foward data sense.

// Feature management
async function refreshFeatures() {
    try {
        const response = await fetch('/datasetmodel/list');
        const features = await response.json();
        const featureList = document.getElementById('featureList');
        featureList.innerHTML = features.map(feature => `
            <div class="feature-item">
                <h4>${feature.name}</h4>
                <p>${feature.description || 'No description'}</p>
                <small>Dataset type: <b>${feature.dataset_type} </b>  </small> |
                <small>Size: ${feature.size}MB</small>
            </div>
        `).join('');
    } catch (error) {
        console.error('Error fetching features:', error);
    }
}

// Analysis functions
async function analyzeData() {
    const datasetId = document.getElementById('datasetSelect').value;
    if (!datasetId) return;

    try {
        const response = await fetch(`/analysis?dataset_id=${datasetId}`);
        const results = await response.json();
        document.getElementById('analysisResults').innerHTML = 
            `<pre>${JSON.stringify(results, null, 2)}</pre>`;
    } catch (error) {
        console.error('Analysis error:', error);
    }
}

// Initial load
document.addEventListener('DOMContentLoaded', () => {
    refreshFeatures();
});
</script>
{% endblock %}
