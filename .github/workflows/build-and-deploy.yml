name: Build and Deploy to Kubernetes

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  NAMESPACE: painel-amanaje
  #IMAGE_NAME: ${{ github.repository }}

jobs:      

  build:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write

    steps:
      - name: Declaring IMAGE and REPO
        run: |
          $repo = "{{ github.repository }}".ToLower()
          echo "IMAGE_NAME=$repo" >> $env:GITHUB_ENV

      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: ${{ github.event_name == 'push' }}
          tags: |
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api:${{ github.sha }} 
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api:latest
          cache-from: type=local,src=${{ github.workspace }}/.buildx-cache
          cache-to: type=local,dest=${{ github.workspace }}/.buildx-cache-new,mode=max

      - name: Build and push MLflow image
        uses: docker/build-push-action@v5
        with:
          context: ./mlflow-server
          push: ${{ github.event_name == 'push' }}
          tags: |
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/mlflow:${{ github.sha }} 
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/mlflow:latest
          cache-from: type=local,src=${{ github.workspace }}/.buildx-cache
          cache-to: type=local,dest=${{ github.workspace }}/.buildx-cache-new,mode=max

  deploy:
    needs: build
    runs-on: self-hosted
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Check Secret Length
        run: echo "${{ secrets.KUBE_CONFIG }}" | wc -c

      - name: Configure kubectl
        shell: bash
        env:
          KUBE_CONFIG_DATA: "${{ secrets.KUBE_CONFIG }}"
        run: |
          mkdir -p $HOME/.kube
          echo "$KUBE_CONFIG_DATA" | base64 -di > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          kubectl config use-context docker-desktop

      - name: Create Namespace 
        run : kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/ -n ${{ env.NAMESPACE }}
          kubectl rollout status deployment/api -n ${{ env.NAMESPACE }} --timeout=5m
