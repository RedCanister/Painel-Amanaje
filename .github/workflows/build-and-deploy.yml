name: Build and Deploy to Kubernetes

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  #IMAGE_NAME: ${{ github.repository }}

jobs:      

  build:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set IMAGE_NAME to lowercase
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Clean-up Build 
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large_packages: true
          swap_storage: true

      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: ${{ github.event_name == 'push' }}
          tags: |
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api:${{ github.sha }} 
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push MLflow image
        uses: docker/build-push-action@v5
        with:
          context: ./mlflow-server
          push: ${{ github.event_name == 'push' }}
          tags: |
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/mlflow:${{ github.sha }} 
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/mlflow:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: self-hosted
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Check Secret Length
        run: echo "${{ secrets.KUBE_CONFIG }}" | wc -c

      - name: Configure kubectl
        env:
          KUBE_CONFIG_DATA: "${{ secrets.KUBE_CONFIG }}"
        run: |
          mkdir -p $HOME/.kube
          echo  | base64 -di > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/ -n painel-amanaje
          kubectl apply -f k8s/configmap.yml
          kubectl apply -f k8s/secrets.yml
          kubectl apply -f k8s/postgres.yml
          kubectl apply -f k8s/redis.yml
          kubectl apply -f k8s/mlflow.yml
          kubectl apply -f k8s/api.yml
          kubectl rollout status deployment/api -n painel-amanaje --timeout=5m
