name: Build and Deploy to Kubernetes

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: kubernetes-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  NAMESPACE: painel-amanaje

jobs:      

  build:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    outputs:
      api_image: ${{ steps.image_meta.outputs.api_image }}
      mlflow_image: ${{ steps.image_meta.outputs.mlflow_image }}

    steps:
      - name: Prepare image names
        id: image_meta
        shell: powershell
        run: |
          $repo = "${{ github.repository }}".ToLower()
          "IMAGE_NAME=$repo" >> $env:GITHUB_ENV
          "IMAGE_REPO=${{ env.REGISTRY }}/$repo" >> $env:GITHUB_ENV
          "api_image=${{ env.REGISTRY }}/$repo/api:${{ github.sha }}" >> $env:GITHUB_OUTPUT
          "mlflow_image=${{ env.REGISTRY }}/$repo/mlflow:${{ github.sha }}" >> $env:GITHUB_OUTPUT

      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: ${{ github.event_name == 'push' }}
          tags: |
              ${{ steps.image_meta.outputs.api_image }}
              ${{ env.IMAGE_REPO }}/api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build and push MLflow image
        uses: docker/build-push-action@v5
        with:
          context: ./mlflow-server
          push: ${{ github.event_name == 'push' }}
          tags: |
              ${{ steps.image_meta.outputs.mlflow_image }}
              ${{ env.IMAGE_REPO }}/mlflow:latest
          cache-from: type=gha,scope=mlflow
          cache-to: type=gha,scope=mlflow,mode=max

  deploy:
    needs: build
    runs-on: self-hosted
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        shell: powershell

    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        shell: powershell
        env:
          KUBE_CONFIG_DATA: "${{ secrets.KUBE_CONFIG }}"
          KUBE_CONTEXT: "${{ secrets.KUBE_CONTEXT }}"
        run: |
          if (!(Test-Path "$HOME\.kube")) {
              New-Item -ItemType Directory -Force -Path "$HOME\.kube"
          }

          $bytes = [System.Convert]::FromBase64String($env:KUBE_CONFIG_DATA)
          [System.IO.File]::WriteAllBytes("$HOME\.kube\config", $bytes)

          if ($env:KUBE_CONTEXT) {
              kubectl config use-context $env:KUBE_CONTEXT
          }

      - name: Create Namespace 
        run : kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/ -n ${{ env.NAMESPACE }}
          kubectl set image deployment/mlflow mlflow=${{ needs.build.outputs.mlflow_image }} -n ${{ env.NAMESPACE }}
          kubectl set image deployment/api api=${{ needs.build.outputs.api_image }} -n ${{ env.NAMESPACE }}
          kubectl rollout status deployment/mlflow -n ${{ env.NAMESPACE }} --timeout=10m
          kubectl rollout status deployment/api -n ${{ env.NAMESPACE }} --timeout=10m
