apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: painel-amanaje
spec:
  selector:
    app: mlflow
  type: NodePort
  ports:
  - port: 5000
    targetPort: 5000
  
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: painel-amanaje
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      containers:
      - name: mlflow
        image: ghcr.io/redcanister/painel-amanaje/mlflow:latest
        ports:
        - containerPort: 5000
        envFrom:
        - configMapRef:
            name: painel-amanaje-config
        - secretRef:
            name: painel-amanaje-secrets
        volumeMounts:
        - name: mlruns
          mountPath: /mlruns
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: mlruns
        persistentVolumeClaim:
          claimName: mlruns-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlruns-pvc
  namespace: painel-amanaje
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
