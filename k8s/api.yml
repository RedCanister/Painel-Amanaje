apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: painel-amanaje
spec:
  selector:
    app: api
  type: NodePort
  ports:
  - name: http
    port: 8000
    targetPort: 8000
  
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: painel-amanaje
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      imagePullSecrets:
        - name: ghcr-login
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

      containers:
      - name: api
        image: ghcr.io/redcanister/painel-amanaje/api:latest
        imagePullPolicy: Always
        securityContext:
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: painel-amanaje-config
        - secretRef:
            name: painel-amanaje-secrets
        volumeMounts:
        #- name: app
        #  mountPath: /app
        - name: data
          mountPath: /data
        - name: models
          mountPath: /models
        - name: mlruns
          mountPath: /mlruns
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          failureThreshold: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8000
          periodSeconds: 15

      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: data-pvc
      - name: models
        persistentVolumeClaim:
          claimName: models-pvc
      - name: mlruns
        persistentVolumeClaim:
          claimName: mlruns-pvc
    
    
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-pvc
  namespace: painel-amanaje
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: models-pvc
  namespace: painel-amanaje
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
