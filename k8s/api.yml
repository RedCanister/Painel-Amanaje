apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: painel-amanaje
spec:
  selector:
    app: api
  ports:
  - port: 8000
    targetPort: 8000
  type: LoadBalancer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: painel-amanaje
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      imagePullSecrets:
        - name : ghcr-login
      containers:
      - name: api
        image: ghcr.io/RedCanister/painel-amanaje/api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: painel-amanaje-config
        - secretRef:
            name: painel-amanaje-secrets
        volumeMounts:
        - name: app
          mountPath: /app
        - name: data
          mountPath: /data
        - name: models
          mountPath: /models
        - name: mlruns
          mountPath: /mlruns
        livenessProbe:
          httpGet:
            path: /docs
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /docs
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: app
        configMap:
          name: api-code
      - name: data
        persistentVolumeClaim:
          claimName: data-pvc
      - name: models
        persistentVolumeClaim:
          claimName: models-pvc
      - name: mlruns
        persistentVolumeClaim:
          claimName: mlruns-pvc
    
    
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-pvc
  namespace: painel-amanaje
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: models-pvc
  namespace: painel-amanaje
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
