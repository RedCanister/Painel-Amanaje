
x-airflow-common-env: &airflow-common-env
  
  # CORE AIRFLOW ENVIRONMENT VARIABLES
  AIRFLOW__CORE__EXECUTOR: "CeleryExecutor"
  AIRFLOW__CORE__LOAD_EXAMPLES: "False"
  AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
  AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW_FERNET_KEY:-}"
  AIRFLOW__CORE__DAGS_FOLDER: "/opt/airflow/dags"
  AIRFLOW__CORE__PLUGINS_FOLDER: "/opt/airflow/plugins"
  
  # DATABASE AND CELERY CONFIGURATION
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:${POSTGRES_PASSWORD:-airflow}@postgres/airflow"
  AIRFLOW__CELERY__BROKER_URL: "redis://redis:6379/0"
  AIRFLOW__CELERY__RESULT_BACKEND: "db+postgresql://airflow:${POSTGRES_PASSWORD:-airflow}@postgres/airflow"
  AIRFLOW__LOGGING__BASE_LOG_FOLDER: "/opt/airflow/logs"
  
  # NETWORK PORT CONFIGURATION
  AIRFLOW_UID: "${AIRFLOW_UID:-50000}"
  AIRFLOW_API_HOST: "0.0.0.0"
  AIRFLOW_API_PORT: "8080"

  # AUTHENTICATION AND SECURITY

x-airflow-common: &airflow-common
  image: apache/airflow:3.1.0
  environment: *airflow-common-env

  # STANDARD AIRFLOW VOLUMES
  volumes:
    - ./dags:/opt/airflow/dags:cached
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins:cached
    - ./config/airflow.cfg:/opt/airflow/airflow.cfg:ro
    - ./dependencies:/opt/airflow/requirements.txt:ro
  restart: unless-stopped
  networks:
      - backend

# SERVICES CONFIGURATION
services:

  # STORAGE SERVICES

  # POSTGRES DB SERVICE
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: airflow
    volumes:
      - postgres_db:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - backend
    
  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    networks:
      - backend

  # REDIS DB SERVICE
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      retries: 5
    networks:
      - backend


  # AIRFLOW SERVICES

  # AIRFLOW INITIALIZATION CONTAINER
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        if [[ -z "${AIRFLOW_UID}" ]]; then
          export AIRFLOW_UID=$$(id -u 2>/dev/null || echo 50000)
        fi
        mkdir -p /opt/airflow/{logs,dags,plugins,config}
        /entrypoint airflow version
        /entrypoint airflow db migrate
        /entrypoint airflow users create --username "${_AIRFLOW_WWW_USER_USERNAME:-airflow}" --password "${_AIRFLOW_WWW_USER_PASSWORD:-airflow}" --firstname Admin --lastname User --role Admin --email admin@example.com || true
        chown -R "${AIRFLOW_UID}:0" /opt/airflow/
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
      _PIP_ADDITIONAL_REQUIREMENTS: ''
    user: "0:0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # AIRFLOW WEBSERVER CONTAINER
  airflow-webserver:
    <<: *airflow-common
    ports:
      - "8080:8080"
    command: api-server
    depends_on:
      airflow-init:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # AIRFLOW SCHEDULER CONTAINER
  # airflow-scheduler:
  #  <<: *airflow-common
  #  command: scheduler
  #  depends_on:
  #    - airflow-init

  # airflow-worker:
  #  <<: *airflow-common
  #  command: celery worker
  #  depends_on:
  #    - airflow-init

  # AIRFLOW TRIGGERER CONTAINER
  # airflow-triggerer:
  #  <<: *airflow-common
  #  command: triggerer
  #  depends_on:
  #    - airflow-init

  # AIRFLOW FLOWER CONTAINER
  #airflow-flower:
  #  <<: *airflow-common
  #  command: celery flower --port=5555
  #  ports:
  #    - "5555:5555"
  #  depends_on:
  #    - airflow-init

  # airflow-dag-processor:
  #  <<: *airflow-common
  #  command: dag-processor
  #  healthcheck:
  #    test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
  #    interval: 30s
  #    timeout: 10s
  #    retries: 5
  #    start_period: 30s
  #  depends_on:
  #    airflow-init:
  #      condition: service_completed_successfully

  # MISCELLANEOUS SERVICES

  # MLFLOW SERVER CONTAINER
  mlflow:
    build:
      context: ./mlflow-server
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns
      - ./mlflow-server:/app:cached
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - backend

  # FASTAPI SERVICE CONTAINER
  api:
    build:
      context: ./api
    env_file:
      - .env
    volumes:
      - ./api:/app:cached
      - ./data:/data
      - ./mlruns:/mlruns
      - ./models:/models
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-webserver:
        condition: service_started
      airflow-init:
        condition: service_started
      mlflow:
        condition: service_started
    restart: unless-stopped
    networks:
      - backend

  # PLOTLY DASHBOARD SERVICE CONTAINER
